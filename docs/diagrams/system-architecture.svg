<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title description">
  <title id="title">OpsFlow system architecture</title>
  <desc id="description">Next.js frontend, Express TypeScript API, policy and workflow services, Prisma and PostgreSQL with trust boundaries and reliability controls.</desc>
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence baseFrequency="0.014" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.1"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#334155"/></marker>
    <style>
      .h1{font:700 34px 'Segoe Print','Comic Sans MS',sans-serif;fill:#102a43;letter-spacing:1px}
      .h2{font:700 21px 'Segoe Print','Comic Sans MS',sans-serif;fill:#102a43}
      .h3{font:700 17px 'Segoe Print','Comic Sans MS',sans-serif;fill:#243b53}
      .t{font:15px 'Segoe Print','Comic Sans MS',sans-serif;fill:#334e68}
      .tiny{font:13px 'Segoe Print','Comic Sans MS',sans-serif;fill:#486581}
      .box{stroke:#334155;stroke-width:2.3;rx:18;filter:url(#shadow)}
      .boundary{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:10 7;rx:24}
      .arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow);filter:url(#rough)}
      .sync{stroke:#0f766e}.read{stroke:#2563eb}.write{stroke:#7c3aed}
    </style>
  </defs>
  <rect width="1600" height="1120" fill="#f8fbff"/>
  <text x="55" y="65" class="h1">OPSFLOW | SYSTEM ARCHITECTURE</text>
  <text x="55" y="100" class="t">Department-scoped work management with explicit authorization, concurrency controls and auditable workflow</text>

  <rect x="45" y="135" width="320" height="790" class="boundary"/>
  <text x="70" y="170" class="h2">CLIENT / BROWSER</text>
  <rect x="80" y="210" width="250" height="145" fill="#dff6ff" class="box"/>
  <text x="110" y="250" class="h2">Next.js + React</text>
  <text x="110" y="282" class="t">Dashboard and role-aware UI</text>
  <text x="110" y="310" class="t">20-item server pagination</text>
  <text x="110" y="338" class="t">Safe action feedback</text>

  <rect x="80" y="405" width="250" height="172" fill="#e7f5ea" class="box"/>
  <text x="110" y="445" class="h2">Request reliability</text>
  <text x="110" y="478" class="t">Abort obsolete requests</text>
  <text x="110" y="506" class="t">Sequence guards</text>
  <text x="110" y="534" class="t">Stable create retry key</text>
  <text x="110" y="562" class="t">Robust error parser</text>

  <rect x="80" y="630" width="250" height="205" fill="#f0e9ff" class="box"/>
  <text x="110" y="670" class="h2">User experience</text>
  <text x="110" y="703" class="t">Admin / Manager / Employee</text>
  <text x="110" y="731" class="t">Department selectors</text>
  <text x="110" y="759" class="t">Comments and history</text>
  <text x="110" y="787" class="t">Approval actions</text>
  <text x="110" y="815" class="t">5-second status messages</text>

  <rect x="415" y="135" width="750" height="880" class="boundary"/>
  <text x="440" y="170" class="h2">TRUSTED API BOUNDARY | NODE.JS + EXPRESS + TYPESCRIPT</text>

  <rect x="455" y="210" width="300" height="150" fill="#fff7d6" class="box"/>
  <text x="485" y="250" class="h2">HTTP boundary</text>
  <text x="485" y="283" class="t">Cookie/session authentication</text>
  <text x="485" y="311" class="t">Zod request validation</text>
  <text x="485" y="339" class="t">Stable safe error envelope</text>

  <rect x="820" y="210" width="300" height="150" fill="#ffe8e8" class="box"/>
  <text x="850" y="250" class="h2">Authorization policy</text>
  <text x="850" y="283" class="t">Reload active user + role</text>
  <text x="850" y="311" class="t">Resolve department membership</text>
  <text x="850" y="339" class="t">Resource check on every route</text>

  <rect x="455" y="415" width="665" height="245" fill="#e8f1ff" class="box"/>
  <text x="485" y="455" class="h2">Domain modules</text>
  <rect x="485" y="485" width="180" height="135" fill="#ffffff" stroke="#2563eb" stroke-width="2" rx="14"/>
  <text x="510" y="520" class="h3">Work items</text>
  <text x="510" y="550" class="tiny">List / detail / create</text>
  <text x="510" y="575" class="tiny">Claim / assign / edit</text>
  <text x="510" y="600" class="tiny">Comments / history</text>
  <rect x="695" y="485" width="180" height="135" fill="#ffffff" stroke="#7c3aed" stroke-width="2" rx="14"/>
  <text x="720" y="520" class="h3">Workflow</text>
  <text x="720" y="550" class="tiny">Transition policy</text>
  <text x="720" y="575" class="tiny">Approval separation</text>
  <text x="720" y="600" class="tiny">Terminal states</text>
  <rect x="905" y="485" width="180" height="135" fill="#ffffff" stroke="#0f766e" stroke-width="2" rx="14"/>
  <text x="930" y="520" class="h3">Users / teams</text>
  <text x="930" y="550" class="tiny">Memberships</text>
  <text x="930" y="575" class="tiny">Provision / revoke</text>
  <text x="930" y="600" class="tiny">Active status</text>

  <rect x="455" y="715" width="315" height="235" fill="#e9f7ef" class="box"/>
  <text x="485" y="755" class="h2">Write guarantees</text>
  <text x="485" y="790" class="t">Idempotency unique constraint</text>
  <text x="485" y="820" class="t">Atomic conditional claim</text>
  <text x="485" y="850" class="t">Expected-version compare/swap</text>
  <text x="485" y="880" class="t">Mutation + audit transaction</text>
  <text x="485" y="910" class="t">No audit on rejected writes</text>

  <rect x="805" y="715" width="315" height="235" fill="#f0e9ff" class="box"/>
  <text x="835" y="755" class="h2">Synchronous side effects</text>
  <text x="835" y="790" class="t">Audit history</text>
  <text x="835" y="820" class="t">In-app notification rows</text>
  <text x="835" y="850" class="t">Safe structured maintainer logs</text>
  <text x="835" y="895" class="tiny">No external queue or background</text>
  <text x="835" y="920" class="tiny">worker in assessment scope</text>

  <rect x="1215" y="135" width="340" height="790" class="boundary"/>
  <text x="1240" y="170" class="h2">DATA LAYER</text>
  <rect x="1250" y="230" width="270" height="145" fill="#f0e9ff" class="box"/>
  <text x="1280" y="270" class="h2">Prisma Client</text>
  <text x="1280" y="303" class="t">Typed queries + transactions</text>
  <text x="1280" y="331" class="t">Migrations + seed</text>
  <text x="1280" y="359" class="t">Constraint error mapping</text>

  <path d="M1375 376 L1375 445" class="arrow write"/>
  <rect x="1250" y="455" width="270" height="260" fill="#dff6ff" class="box"/>
  <text x="1280" y="495" class="h2">PostgreSQL</text>
  <text x="1280" y="530" class="t">Users + memberships</text>
  <text x="1280" y="560" class="t">Teams + work items</text>
  <text x="1280" y="590" class="t">Comments + notifications</text>
  <text x="1280" y="620" class="t">Audit logs</text>
  <text x="1280" y="665" class="tiny">Unique idempotency index</text>
  <text x="1280" y="690" class="tiny">Department/status query indexes</text>

  <rect x="1250" y="770" width="270" height="110" fill="#fff4e6" class="box"/>
  <text x="1280" y="810" class="h2">Docker Compose</text>
  <text x="1280" y="843" class="t">Local PostgreSQL runtime</text>
  <text x="1280" y="868" class="tiny">Port 5432 + persistent volume</text>

  <path d="M332 282 L450 282" class="arrow sync"/>
  <text x="350" y="264" class="tiny">HTTPS / JSON</text>
  <path d="M755 285 L815 285" class="arrow"/>
  <path d="M970 360 C970 390 795 385 795 410" class="arrow"/>
  <path d="M1120 540 L1245 305" class="arrow write"/>
  <text x="1135" y="420" class="tiny">Prisma</text>
  <path d="M1250 600 C1185 600 1185 830 1125 830" class="arrow read"/>
  <text x="1165" y="735" class="tiny">rows / conflicts</text>

  <rect x="415" y="1040" width="1140" height="52" fill="#eef2ff" stroke="#4338ca" stroke-width="2" rx="16"/>
  <text x="445" y="1073" class="h3">Security rule: frontend visibility improves UX; the API and database write conditions remain the enforcement boundary.</text>
</svg>
